name: Bug 报告
description: 报告一个可复现的问题（框架层 / CLI / 打包产物）
labels: [bug]
body:
  - type: markdown
    value: |
      安全漏洞请走 [SECURITY.md](https://github.com/YUfeng12TA/freedom/blob/main/SECURITY.md) 的私密渠道，不要在这里公开细节。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 现象 + 你期望的行为。报错请贴原文，不要转述。
      placeholder: |
        期望：freedom shell build linux 编出可运行壳
        实际：go build 报 `Package webkit2gtk-4.0 was not found`
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从干净仓库开始的最小步骤；能跑的命令优先于文字描述。
      value: |
        1. git clone ... && cd ...
        2. 命令：
        3. 输出：
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: 出问题的层
      multiple: true
      options:
        - 框架壳层（Go / freedom.go、window_*、bridge、dispatch）
        - 安全容器（FRDM3 / resources 加密 / 反调试）
        - 系统集成（托盘 / 热键 / 剪贴板 / 通知 / 单实例 / store）
        - 后端进程 IPC（backend_proc / NDJSON 协议）
        - freedom-cli（npm：new / build / dev / shell / keygen / manifest / desktop）
        - 构建与打包（build.ps1 / build.sh / CI / NSIS / 产物矩阵）
        - 前端 SDK（assets/freedom.js）
        - 文档
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      multiple: true
      options:
        - win-x64
        - darwin-arm64
        - linux-x64
        - 跨平台 / 与平台无关
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 系统具体版本
      description: 影响 WebView 后端与依赖包（例：Windows 11 23H2 / Ubuntu 24.04 / macOS 15；WSL 请注明发行版与 WSLg 情况）。
      placeholder: Ubuntu 24.04（仅装 libwebkit2gtk-4.1-dev）
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: 版本
      description: >-
        CLI 用 `freedom version`（同时检测最新）；框架用 `node -p "require('./freedom-cli/package.json').version"` + `git rev-parse --short HEAD`。
      placeholder: freedom-cli 1.14.0-preview / 框架 main@8033da4
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 日志 / 退出码 / 诊断
      description: >-
        完整 stderr、`go env GOFLAGS CGO_ENABLED`、Linux 下 `pkg-config --modversion webkit2gtk-4.0 4.1` 结果、
        产物 `ldd` / 崩溃退出码。high 模式产物请注明是否命中反调试（退出码 77）。
      render: shell

  - type: textarea
    id: tried
    attributes:
      label: 你已经试过什么
      description: 已排除的方向能显著缩短定位时间。

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue，确认不是重复问题
          required: true
        - label: 我贴的日志与代码不含密钥、token 或私有源码
          required: true
