name: build

# Freedom 三平台打包验证：每个平台编译壳层 + 编译型后端，
# 并运行 IPC 协议测试（Go/Node/Python/Rust 四种语言后端）。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
            exe: .exe
          - os: macos-latest
            shell: bash
            exe: ""
          # webview_go 的 CGO 依赖 pkg-config 包 webkit2gtk-4.0，
          # 其开发包自 Ubuntu 24.04 起已从官方源移除，故钉在 22.04。
          - os: ubuntu-22.04
            shell: bash
            exe: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Ubuntu 需要 WebKitGTK / GTK 开发库（webview_go CGO 依赖，4.0 API）
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev build-essential

      - uses: dtolnay/rust-toolchain@stable

      # 编译 Go 后端（测试与打包共用）；产物名经 matrix.exe 适配平台，脚本跨 shell 通用
      - name: Build Go backend
        run: go build -o examples/multiproc/backends/go_backend${{ matrix.exe }} ./examples/multiproc/backends

      # 编译 Rust 后端（零依赖单文件）
      - name: Build Rust backend
        working-directory: examples/multiproc/backends
        run: rustc -O -o rust_backend${{ matrix.exe }} rust_backend.rs

      - name: go vet
        run: go vet ./...

      # IPC 协议测试：同一套断言跑 Go / Node / Python / Rust 四个后端
      - name: Protocol tests
        env:
          CGO_ENABLED: "1"
        run: go test -v ./...

      # 打包壳层
      - name: Build shells
        env:
          CGO_ENABLED: "1"
        run: |
          go build -o dist/hello${{ matrix.exe }} ./examples/hello
          go build -o dist/multiproc${{ matrix.exe }} ./examples/multiproc

      - uses: actions/upload-artifact@v4
        with:
          name: freedom-${{ runner.os }}
          path: dist/
