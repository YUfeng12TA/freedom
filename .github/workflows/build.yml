name: build

# Freedom 三平台打包验证：每个平台编译壳层 + 编译型后端，
# 并运行 IPC 协议测试（Go/Node/Python/Rust 四种语言后端）。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
          - os: macos-latest
            shell: bash
          - os: ubuntu-latest
            shell: bash
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Ubuntu 需要 WebKitGTK / GTK 开发库（webview_go CGO 依赖）
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev build-essential

      - uses: dtolnay/rust-toolchain@stable

      # 编译 Go 后端（测试与打包共用）
      - name: Build Go backend
        run: |
          if ("${{ runner.os }}" -eq "Windows") {
            go build -o examples/multiproc/backends/go_backend.exe ./examples/multiproc/backends
          } else {
            go build -o examples/multiproc/backends/go_backend ./examples/multiproc/backends
          }

      # 编译 Rust 后端（零依赖单文件）
      - name: Build Rust backend
        run: |
          if ("${{ runner.os }}" -eq "Windows") {
            cd examples/multiproc/backends; rustc -O -o rust_backend.exe rust_backend.rs
          } else {
            cd examples/multiproc/backends; rustc -O -o rust_backend rust_backend.rs
          }
        working-directory: ${{ github.workspace }}

      - name: go vet
        run: go vet ./...

      # IPC 协议测试：同一套断言跑 Go / Node / Python / Rust 四个后端
      - name: Protocol tests
        env:
          CGO_ENABLED: "1"
        run: go test -v ./...

      # 打包壳层
      - name: Build shells
        env:
          CGO_ENABLED: "1"
        run: |
          if ("${{ runner.os }}" -eq "Windows") {
            go build -o dist/hello.exe ./examples/hello
            go build -o dist/multiproc.exe ./examples/multiproc
          } else {
            go build -o dist/hello ./examples/hello
            go build -o dist/multiproc ./examples/multiproc
          }

      - uses: actions/upload-artifact@v4
        with:
          name: freedom-${{ runner.os }}
          path: dist/
